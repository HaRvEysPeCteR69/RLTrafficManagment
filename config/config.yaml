# QPSO Delivery Route Optimizer Configuration
# Environment settings
environment:
  net_file: "networks/delhi/delhi_intersection.net.xml"
  route_file: "networks/delhi/routes.rou.xml"
  sumo_cfg: "networks/delhi/delhi_intersection.sumocfg"
  additional_file: "networks/delhi/delhi_vtypes.add.xml,networks/delhi/delhi_closures.add.xml"
  use_gui: false
  step_length: 1.0
  num_seconds: 3600

# Delivery Vehicle Fleet settings
delivery:
  vehicle_type: "two_wheeler"  # Indian delivery two-wheeler (motorcycle/scooter)
  fleet_size: 5
  depot_edge: "28103794#0"

# QPSO Optimizer hyperparameters
qpso:
  num_particles: 30
  max_iterations: 60
  beta: 0.75                  # Contraction-expansion coefficient
  anneal_beta: true
  seed: 42

# Objective function weights
objective:
  weight_travel_time: 1.0
  weight_volatility: 0.6
  weight_distance: 0.05

# Volatility Index settings
volatility:
  window_size: 15
  smoothing_factor: 0.2

# Reactive Rule settings
reactive:
  speed_drop_threshold: 0.35   # Trigger reroute if current speed < 35% of free-flow
  delay_threshold_seconds: 90.0
  volatility_trigger: 0.75

# Output and logging
logging:
  results_dir: "results"
  outputs_dir: "outputs"
