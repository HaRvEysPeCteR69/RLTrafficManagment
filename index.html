<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QPSO Delivery Route Optimizer — Live Delhi Mission Control</title>
  <meta name="description" content="Real-time interactive Leaflet visualization of Volatility-Adaptive QPSO delivery routing on Delhi Connaught Place network.">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <style>
    :root {
      --bg-dark: #0a0e17;
      --panel-bg: rgba(13, 19, 33, 0.85);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --tier-calm: #10b981;
      --tier-moderate: #f59e0b;
      --tier-turbulent: #ef4444;
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #map {
      height: 100%;
      width: 100%;
      background: #080c14;
      z-index: 1;
    }

    /* Top Navigation HUD */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 12px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      font-size: 24px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .brand-text h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #fff;
    }

    .brand-text p {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .scenario-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    select, button {
      font-family: var(--font-main);
      font-size: 13px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 7px 12px;
      outline: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    select:hover, button:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent);
    }

    button.primary {
      background: #0284c7;
      border-color: #38bdf8;
      font-weight: 600;
    }

    button.primary:hover {
      background: #0369a1;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Floating Stats Card (Left Side) */
    .hud-panel {
      position: absolute;
      top: 90px;
      left: 16px;
      z-index: 1000;
      width: 320px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 8px;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .tier-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--tier-calm);
      border: 1px solid var(--tier-calm);
      transition: all 0.3s ease;
    }

    .tier-badge.moderate {
      background: rgba(245, 158, 11, 0.15);
      color: var(--tier-moderate);
      border-color: var(--tier-moderate);
    }

    .tier-badge.turbulent {
      background: rgba(239, 68, 68, 0.15);
      color: var(--tier-turbulent);
      border-color: var(--tier-turbulent);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
    }

    .tier-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .metric-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 10px;
    }

    .metric-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 18px;
      font-family: var(--font-mono);
      font-weight: 700;
      color: #fff;
    }

    /* Live Event Ticker */
    .event-ticker {
      font-size: 12px;
      background: rgba(0, 0, 0, 0.3);
      border-left: 3px solid var(--accent);
      padding: 8px 12px;
      border-radius: 0 6px 6px 0;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .event-time {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--accent);
      margin-bottom: 2px;
    }

    .event-desc {
      color: #e2e8f0;
      line-height: 1.3;
    }

    /* Bottom Playback Control Bar */
    .bottom-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: min(720px, calc(100vw - 32px));
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 14px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .playback-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .timeline-slider {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    .timeline-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      cursor: pointer;
    }

    .time-display {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-muted);
      min-width: 90px;
      text-align: right;
    }

    /* Custom Leaflet Pin Markers */
    .stop-marker-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #0f172a;
      border: 2px solid var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      font-family: var(--font-mono);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }

    .vehicle-courier-marker {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--tier-calm);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--tier-calm);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      color: #000;
      font-size: 16px;
    }

    .vehicle-courier-marker.moderate {
      background: var(--tier-moderate);
      box-shadow: 0 0 20px var(--tier-moderate);
    }

    .vehicle-courier-marker.turbulent {
      background: var(--tier-turbulent);
      box-shadow: 0 0 20px var(--tier-turbulent);
    }
  </style>
</head>
<body>

  <!-- Top Navigation & Scenario Bar -->
  <header class="top-bar">
    <div class="brand-section">
      <div class="brand-icon">🚚</div>
      <div class="brand-text">
        <h1>Delhi QPSO Delivery Route Optimizer</h1>
        <p>Quantum Swarm Navigation over Volatile Indian Road Networks</p>
      </div>
    </div>
    <div class="scenario-controls">
      <select id="scenario-selector" aria-label="Select Scenario">
        <option value="hero_medium_va_qpso" selected>Medium Volatility (Incident @ 120s) — VA-QPSO</option>
        <option value="hero_medium_fixed_beta_qpso">Medium Volatility (Incident @ 120s) — Fixed Beta</option>
        <option value="hero_high_va_qpso">High Volatility (Peak Surge & Closures) — VA-QPSO</option>
        <option value="hero_high_fixed_beta_qpso">High Volatility (Peak Surge & Closures) — Fixed Beta</option>
        <option value="hero_low_va_qpso">Low Volatility (Off-Peak) — VA-QPSO</option>
        <option value="hero_low_fixed_beta_qpso">Low Volatility (Off-Peak) — Fixed Beta</option>
      </select>
      <button id="btn-reset-view">📍 Center Map</button>
      <button id="btn-toggle-tiles">🌓 Map Style</button>
    </div>
  </header>

  <!-- Left Stats & Telemetry HUD -->
  <aside class="hud-panel">
    <div class="panel-header">
      <span class="panel-title">Traffic Telemetry</span>
      <div id="tier-badge" class="tier-badge">
        <span class="tier-pulse"></span>
        <span id="tier-text">Calm</span>
      </div>
    </div>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">Volatility (V)</div>
        <div id="metric-volatility" class="metric-value">0.0000</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Beta (&beta;)</div>
        <div id="metric-beta" class="metric-value">0.5000</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Route Time</div>
        <div id="metric-route-time" class="metric-value">-- s</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Algorithm</div>
        <div id="metric-algorithm" class="metric-value" style="font-size: 14px;">VA-QPSO</div>
      </div>
    </div>

    <div class="panel-header" style="margin-top: 4px;">
      <span class="panel-title">Mission Event Stream</span>
    </div>
    <div class="event-ticker">
      <div id="event-time" class="event-time">T = 0s [Ready]</div>
      <div id="event-desc" class="event-desc">Loading delivery schedule...</div>
    </div>
  </aside>

  <!-- Map Canvas -->
  <div id="map"></div>

  <!-- Bottom Playback Timeline -->
  <footer class="bottom-bar">
    <div class="playback-row">
      <button id="btn-play-pause" class="primary">▶ Play</button>
      <button id="btn-restart">↺ Reset</button>
      <input type="range" id="timeline" class="timeline-slider" min="0" max="100" value="0" step="0.1" aria-label="Timeline Scrubber">
      <div id="time-display" class="time-display">0.0s / --s</div>
      <select id="speed-selector" aria-label="Playback Speed">
        <option value="0.5">0.5x</option>
        <option value="1.0" selected>1.0x</option>
        <option value="2.0">2.0x</option>
        <option value="5.0">5.0x</option>
      </select>
    </div>
  </footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    // -------------------------------------------------------------
    // Configuration & Delhi Connaught Place Bounding Box
    // -------------------------------------------------------------
    const DELHI_BBOX = [
      [28.625885, 77.215730], // South-West
      [28.641579, 77.236486]  // North-East
    ];
    const MAP_CENTER = [28.6325, 77.2215];

    // Map initialization
    const map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView(MAP_CENTER, 15);

    L.control.zoom({ position: 'topright' }).addTo(map);

    // Tile Layers
    const darkTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd'
    }).addTo(map);

    const osmTiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    });

    let currentTileMode = 'dark';
    document.getElementById('btn-toggle-tiles').addEventListener('click', () => {
      if (currentTileMode === 'dark') {
        map.removeLayer(darkTiles);
        osmTiles.addTo(map);
        currentTileMode = 'osm';
      } else {
        map.removeLayer(osmTiles);
        darkTiles.addTo(map);
        currentTileMode = 'dark';
      }
    });

    document.getElementById('btn-reset-view').addEventListener('click', () => {
      map.fitBounds(DELHI_BBOX);
    });

    // -------------------------------------------------------------
    // State & Layers
    // -------------------------------------------------------------
    let stopMarkers = [];
    let routePolyline = null;
    let vehicleMarker = null;
    let currentRunData = null;
    let isPlaying = false;
    let playbackTime = 0.0;
    let playbackSpeed = 1.0;
    let lastAnimTimestamp = null;
    let animFrameId = null;

    const tierColors = {
      calm: '#10b981',
      moderate: '#f59e0b',
      turbulent: '#ef4444'
    };

    // -------------------------------------------------------------
    // Data Loading with /api/runs/{id} fallback to frontend_data
    // -------------------------------------------------------------
    async function fetchRunData(runId) {
      // 1. Try specified API endpoint
      try {
        const res = await fetch(`/api/runs/${runId}`);
        if (res.ok) return await res.json();
      } catch (err) {
        console.warn(`Could not reach /api/runs/${runId}, attempting static fallback...`);
      }

      // 2. Fallback to bundled local JSON in frontend_data/
      const fallbackUrls = [
        `frontend_data/${runId}.json`,
        `frontend_data/hero_${runId}.json`,
        `frontend_data/hero_medium_va_qpso.json`
      ];

      for (const url of fallbackUrls) {
        try {
          const res = await fetch(url);
          if (res.ok) return await res.json();
        } catch (e) {}
      }

      throw new Error(`Failed to load scenario data for ID: ${runId}`);
    }

    // -------------------------------------------------------------
    // Render Stops & Route
    // -------------------------------------------------------------
    function renderScenario(data) {
      currentRunData = data;

      // Clear previous layers
      stopMarkers.forEach(m => map.removeLayer(m));
      stopMarkers = [];
      if (routePolyline) map.removeLayer(routePolyline);
      if (vehicleMarker) map.removeLayer(vehicleMarker);

      // 1. Draw Numbered Stop Pin Markers
      if (data.stops && data.stops.length > 0) {
        data.stops.forEach((stop, idx) => {
          const pinIcon = L.divIcon({
            className: 'custom-pin',
            html: `<div class="stop-marker-pin">${idx + 1}</div>`,
            iconSize: [28, 28],
            iconAnchor: [14, 14]
          });

          const marker = L.marker([stop.lat, stop.lon], { icon: pinIcon })
            .bindPopup(`<b>${stop.label || 'Stop ' + (idx + 1)}</b><br>Junction ID: ${stop.id}`)
            .addTo(map);

          stopMarkers.push(marker);
        });
      }

      // 2. Draw Route Polyline from path coordinates
      if (data.path && data.path.length > 0) {
        const polyCoords = data.path.map(p => [p.lat, p.lon]);
        routePolyline = L.polyline(polyCoords, {
          color: tierColors.calm,
          weight: 4,
          opacity: 0.8,
          smoothFactor: 1.0
        }).addTo(map);

        map.fitBounds(routePolyline.getBounds(), { padding: [50, 50] });
      }

      // 3. Create Vehicle Marker
      const initialTier = (data.metrics_over_time && data.metrics_over_time[0]) ? data.metrics_over_time[0].tier : 'calm';
      const initialPos = data.path && data.path[0] ? [data.path[0].lat, data.path[0].lon] : MAP_CENTER;

      const vehicleIcon = L.divIcon({
        className: 'vehicle-marker-div',
        html: `<div id="vehicle-icon-inner" class="vehicle-courier-marker ${initialTier}">🛵</div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });

      vehicleMarker = L.marker(initialPos, { icon: vehicleIcon }).addTo(map);

      // Update UI Header Stats
      document.getElementById('metric-route-time').innerText = `${data.completion_time.toFixed(1)}s`;
      document.getElementById('metric-algorithm').innerText = data.algorithm === 'va_qpso' ? 'VA-QPSO' : 'Fixed Beta';
      document.getElementById('timeline').max = data.completion_time;
      document.getElementById('timeline').value = 0;
      document.getElementById('time-display').innerText = `0.0s / ${data.completion_time.toFixed(1)}s`;

      // Reset playback
      playbackTime = 0.0;
      updatePlayback(0.0);
    }

    // -------------------------------------------------------------
    // Hand-Written Position & Metric Interpolation (No Plugins)
    // -------------------------------------------------------------
    function getInterpolatedPosition(t) {
      const path = currentRunData.path;
      if (!path || path.length === 0) return null;
      if (t <= path[0].t) return [path[0].lat, path[0].lon];
      if (t >= path[path.length - 1].t) return [path[path.length - 1].lat, path[path.length - 1].lon];

      // Binary search or linear scan for interval
      let low = 0;
      let high = path.length - 1;
      while (low <= high) {
        const mid = (low + high) >> 1;
        if (path[mid].t <= t) {
          low = mid + 1;
        } else {
          high = mid - 1;
        }
      }
      const i = Math.max(0, high);
      const p1 = path[i];
      const p2 = path[Math.min(path.length - 1, i + 1)];

      const dt = p2.t - p1.t;
      const alpha = dt > 0 ? (t - p1.t) / dt : 0.0;
      const lat = p1.lat + alpha * (p2.lat - p1.lat);
      const lon = p1.lon + alpha * (p2.lon - p1.lon);
      return [lat, lon];
    }

    function getMetricsAtTime(t) {
      const metrics = currentRunData.metrics_over_time;
      if (!metrics || metrics.length === 0) return { volatility_index: 0, beta: 0.5, tier: 'calm' };
      const idx = Math.min(metrics.length - 1, Math.max(0, Math.floor(t)));
      return metrics[idx];
    }

    function getActiveEvent(t) {
      const events = currentRunData.events;
      if (!events || events.length === 0) return null;
      // Return the most recent event up to time t
      let latest = null;
      for (let i = 0; i < events.length; i++) {
        if (events[i].t <= t) latest = events[i];
        else break;
      }
      return latest;
    }

    function updatePlayback(t) {
      if (!currentRunData) return;

      // 1. Move vehicle marker
      const pos = getInterpolatedPosition(t);
      if (pos && vehicleMarker) {
        vehicleMarker.setLatLng(pos);
      }

      // 2. Query metrics and update tier colors
      const metric = getMetricsAtTime(t);
      document.getElementById('metric-volatility').innerText = metric.volatility_index.toFixed(4);
      document.getElementById('metric-beta').innerText = metric.beta.toFixed(4);

      const tierBadge = document.getElementById('tier-badge');
      const tierText = document.getElementById('tier-text');
      const vehicleInner = document.getElementById('vehicle-icon-inner');

      tierBadge.className = `tier-badge ${metric.tier}`;
      tierText.innerText = metric.tier.charAt(0).toUpperCase() + metric.tier.slice(1);

      if (vehicleInner) {
        vehicleInner.className = `vehicle-courier-marker ${metric.tier}`;
      }

      // Color route by tier
      if (routePolyline) {
        routePolyline.setStyle({ color: tierColors[metric.tier] || tierColors.calm });
      }

      // 3. Update active event stream
      const activeEvent = getActiveEvent(t);
      if (activeEvent) {
        document.getElementById('event-time').innerText = `T = ${activeEvent.t.toFixed(0)}s [${activeEvent.type.toUpperCase()}]`;
        document.getElementById('event-desc').innerText = activeEvent.detail;
      }

      // 4. Update slider and time readout
      document.getElementById('timeline').value = t;
      document.getElementById('time-display').innerText = `${t.toFixed(1)}s / ${currentRunData.completion_time.toFixed(1)}s`;
    }

    // -------------------------------------------------------------
    // Animation Loop with requestAnimationFrame
    // -------------------------------------------------------------
    function animationLoop(timestamp) {
      if (!isPlaying) {
        lastAnimTimestamp = null;
        return;
      }

      if (lastAnimTimestamp !== null) {
        const deltaSec = (timestamp - lastAnimTimestamp) / 1000.0;
        playbackTime += deltaSec * playbackSpeed;

        if (playbackTime >= currentRunData.completion_time) {
          playbackTime = currentRunData.completion_time;
          pause();
        }

        updatePlayback(playbackTime);
      }

      lastAnimTimestamp = timestamp;
      animFrameId = requestAnimationFrame(animationLoop);
    }

    function play() {
      if (!currentRunData) return;
      if (playbackTime >= currentRunData.completion_time) {
        playbackTime = 0.0;
      }
      isPlaying = true;
      document.getElementById('btn-play-pause').innerText = '❚❚ Pause';
      document.getElementById('btn-play-pause').classList.remove('primary');
      lastAnimTimestamp = null;
      animFrameId = requestAnimationFrame(animationLoop);
    }

    function pause() {
      isPlaying = false;
      document.getElementById('btn-play-pause').innerText = '▶ Play';
      document.getElementById('btn-play-pause').classList.add('primary');
      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
    }

    // Event Listeners
    document.getElementById('btn-play-pause').addEventListener('click', () => {
      if (isPlaying) pause();
      else play();
    });

    document.getElementById('btn-restart').addEventListener('click', () => {
      pause();
      playbackTime = 0.0;
      updatePlayback(0.0);
    });

    document.getElementById('timeline').addEventListener('input', (e) => {
      playbackTime = parseFloat(e.target.value);
      updatePlayback(playbackTime);
    });

    document.getElementById('speed-selector').addEventListener('change', (e) => {
      playbackSpeed = parseFloat(e.target.value);
    });

    document.getElementById('scenario-selector').addEventListener('change', (e) => {
      pause();
      loadScenario(e.target.value);
    });

    // -------------------------------------------------------------
    // Initial Load
    // -------------------------------------------------------------
    async function loadScenario(scenarioId) {
      try {
        const data = await fetchRunData(scenarioId);
        renderScenario(data);
      } catch (err) {
        console.error(err);
        document.getElementById('event-desc').innerText = `Error loading scenario: ${err.message}`;
      }
    }

    // Parse URL parameter ?run=... or use default
    const urlParams = new URLSearchParams(window.location.search);
    const initialRun = urlParams.get('run') || 'hero_medium_va_qpso';
    document.getElementById('scenario-selector').value = initialRun;
    loadScenario(initialRun);
  </script>
</body>
</html>
